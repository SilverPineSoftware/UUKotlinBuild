name: Publish to GitHub Packages

permissions:
  contents: write
  packages: write

on:
  create:
    tags:
      - '*.*.*'

jobs:

  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ vars.UU_JAVA_DISTRIBUTION }}
          java-version: ${{ vars.UU_JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon

  publish:
    name: Publish convention plugins and catalog
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ vars.UU_JAVA_DISTRIBUTION }}
          java-version: ${{ vars.UU_JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion=${{ github.ref_name }}

  create-release:
    needs: [verify, publish]
    uses: SilverPineSoftware/UUGithubActions/.github/workflows/uu_create_release.yml@main
    secrets:
      UU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare-next-version:
    needs: [create-release]
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
    steps:
      - name: Prepare Next Version
        uses: SilverPineSoftware/UUGithubActions/.github/actions/uu-android-prepare-next-version@main
        continue-on-error: true
        with:
          release_pat: ${{ secrets.RELEASE_PAT }}

  update-org-uu-kotlin-build:
    name: Update UU_KOTLIN_BUILD org variable
    needs: [publish]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Set UU_KOTLIN_BUILD to released version
        env:
          GH_TOKEN: ${{ secrets.CI_ORG_VARS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CI_ORG_VARS_PAT repository secret is not set."
            exit 1
          fi
          gh api --method PATCH \
            orgs/SilverpineSoftware/actions/variables/UU_KOTLIN_BUILD \
            -f value="${{ github.ref_name }}"
          echo "UU_KOTLIN_BUILD=${{ github.ref_name }} (org SilverpineSoftware)" 
