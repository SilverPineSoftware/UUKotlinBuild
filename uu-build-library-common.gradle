import java.text.DateFormat
import java.text.SimpleDateFormat

def uuTrimAndQuote = { val ->
    return "\"" + val.trim() + "\""
}

// Gradle 9.0 removed script-level `exec { }`. Use `providers.exec { }`,
// which returns a lazy ExecOutput and is configuration-cache safe.
def uuRunGit = { String... args ->
    def val = ""

    try {
        def execOutput = providers.exec {
            commandLine(["git", *args])
            ignoreExitValue = true
        }

        def exitValue = execOutput.result.get().exitValue
        if (exitValue == 0) {
            val = execOutput.standardOutput.asText.get()
        } else {
            project.logger.lifecycle("git ${args.join(' ')} exited with $exitValue")
        }
    } catch (ex) {
        project.logger.lifecycle("Caught exception running git ${args.join(' ')}: $ex")
    }

    return val
}

def getBuildBranch = { ->
    return uuRunGit("rev-parse", "--abbrev-ref", "HEAD")
}

ext {
    BUILD_BRANCH = uuTrimAndQuote(getBuildBranch())
}

def getBuildCommitHash = { ->
    def val = uuRunGit("rev-parse", "HEAD")
    def result = uuTrimAndQuote(val)
    project.logger.lifecycle("buildCommitHash: $result")
    return result
}

def getBuildDate = { ->

    DateFormat df = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss ZZZ")
    def val = df.format(new Date())

	def result = "\"" + val.trim().replace("'", "") + "\""
    project.logger.lifecycle("buildDate: $result")
    return result
}

ext {
    PUBLISH_GROUP_ID = 'com.silverpine.uu'
    BUILD_VERSION = version
    BUILD_COMMIT_HASH = getBuildCommitHash()
    BUILD_DATE = getBuildDate()
}

group = PUBLISH_GROUP_ID

project.logger.lifecycle("BUILD_VERSION: $BUILD_VERSION")
project.logger.lifecycle("BUILD_BRANCH: $BUILD_BRANCH")

android {

    defaultConfig {

        buildConfigField "String", "BUILD_VERSION", uuTrimAndQuote(BUILD_VERSION)
        buildConfigField "String", "BUILD_BRANCH", BUILD_BRANCH
        buildConfigField "String", "BUILD_COMMIT_HASH", BUILD_COMMIT_HASH
        buildConfigField "String", "BUILD_DATE", BUILD_DATE
    }
}

tasks.register('androidSourcesJar', Jar) {
    archiveClassifier = 'sources'
    if (project.plugins.findPlugin("com.android.library")) {
        // For Android libraries
        from android.sourceSets.main.java.srcDirs
        from android.sourceSets.main.kotlin.srcDirs
    } else {
        // For pure Kotlin libraries, in case you have them
        from sourceSets.main.java.srcDirs
        from sourceSets.main.kotlin.srcDirs
    }
}

signing {
    useInMemoryPgpKeys(
            rootProject.ext["signing.keyId"],
            rootProject.ext["signing.key"],
            rootProject.ext["signing.password"],
    )
    sign publishing.publications
}

android {
    publishing {
        singleVariant("release") {
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                // The coordinates of the library, being set from variables that
                // we'll set up later
                groupId PUBLISH_GROUP_ID
                artifactId uu_publish_artifact_id
                version BUILD_VERSION

                // Two artifacts, the `aar` (or `jar`) and the sources
                if (project.plugins.findPlugin("com.android.library")) {
                    from components.release
                } else {
                    from components.java
                }

                artifact androidSourcesJar
                //artifact javadocJar

                // Mostly self-explanatory metadata
                pom {
                    name = uu_publish_artifact_id
                    description = uu_publish_description
                    url = 'https://github.com/SilverpineSoftware/' + uu_scm_module_name
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://github.com/SilverpineSoftware/' + uu_scm_module_name + '/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'ryandevore'
                            name = 'Ryan DeVore'
                            email = 'ryan@silverpine.com'
                        }
                        // Add all other devs here...
                    }

                    // Version control info - if you're using GitHub, follow the
                    // format as seen here
                    scm {
                        connection = 'scm:git:github.com/SilverpineSoftware/' + uu_scm_module_name + '.git'
                        developerConnection = 'scm:git:ssh://github.com/SilverpineSoftware/' + uu_scm_module_name + '.git'
                        url = 'https://github.com/SilverpineSoftware/' + uu_scm_module_name + '/tree/main'
                    }
                }
            }
        }
    }
}


android {
    compileSdk = uu_target_sdk.toInteger()

    defaultConfig {
        minSdk = uu_min_sdk.toInteger()
        targetSdk = uu_target_sdk.toInteger()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(uu_java_version)
        targetCompatibility JavaVersion.toVersion(uu_java_version)
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(uu_java_version.toString())
        }
    }

    buildFeatures {
        buildConfig true
    }

    namespace uu_namespace
}
